<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: rgb(7, 0, 29);
                overflow: hidden;
            }
            .container {
                font-size: 15px;
                width: 40em;
                height: 40em;
                position: relative;
            }
            .sun {
                position: absolute;
                top: 13.8em;
                left: 13.8em;
                width: 10em;
                height: 10em;
                background-color: yellow;
                border-radius: 100%;
                box-shadow: 0 0 9em rgb(251, 255, 0);
            }
            .earth,.moon {
                position: absolute;
                border-style: solid;
                border-color: rgba(255, 254, 254, 0.544);
                border-width: 0.8em 0.8em 0 0;
                border-radius: 100%;
            }
            .earth {
                top: 5em;
                left: 6em;
                width: 30em;
                height: 30em;
                animation: orbit 36.6s Linear infinite;
            }
            .moon {
                top: 1em;
                right: 1em;
                width: 8em;
                height: 8em;
                animation: orbit 4.7s Linear infinite;
            }
            .earth::before,
            .moon::before {
                content: '';
                position: absolute;
                border-radius: 50%;
            }
            .earth::before {
                top: 1em;
                right: 3em;
                width: 4em;
                height: 4em;
                background-color: rgb(3, 248, 3);
            }
            .moon::before{
                top: 6.5em;
                left: 7em;
                right: 13em;
                width: 3em;
                height: 3em;
                background-color: rgb(156, 152, 152);
            }
            @keyframes orbit {
                to {
                    transform: rotate(360deg);
                }
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="sun"></div>
            <div class="earth">
                <div class="moon"></div>
            </div>




        </div>
    </body>
</html>
